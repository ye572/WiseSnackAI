<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiseSnack · 干货捞捞 — AI 知识整理工具</title>

  <!-- Google Fonts: Caveat (hero), Fredoka (headings), Nunito (body), ZCOOL KuaiLe (Chinese decorative) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            warm: {
              '50': '#fdfaf5',
              '100': '#f8f4ed',
              '200': '#eee7db',
              '300': '#ddd1c0',
              '400': '#b8a898',
              '500': '#8c7b6e',
              '600': '#6b5d52',
              '700': '#4a3f35',
              '800': '#3d3226',
              '900': '#2d2318',
            },
            honey: {
              '50': '#fef8f0',
              '100': '#fdf0e0',
              '200': '#fbdfbc',
              '300': '#f5c48c',
              '400': '#e8a860',
              '500': '#d4913e',
              '600': '#b8782a',
            },
          },
          fontFamily: {
            'fredoka': ['"Fredoka"', '"Noto Sans SC"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
            'nunito': ['"Nunito"', '"Noto Sans SC"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
            'caveat': ['"Caveat"', 'cursive'],
            'kuai': ['"ZCOOL KuaiLe"', '"Noto Sans SC"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
            'noto': ['"Noto Sans SC"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
          },
          fontSize: {
            '2xs': ['0.688rem', { lineHeight: '1.4' }],
            'xs': ['0.75rem', { lineHeight: '1.5' }],
            'sm': ['0.875rem', { lineHeight: '1.55' }],
            'base': ['1rem', { lineHeight: '1.6' }],
            'lg': ['1.125rem', { lineHeight: '1.55' }],
            'xl': ['1.25rem', { lineHeight: '1.5' }],
            '2xl': ['1.5rem', { lineHeight: '1.4' }],
          },
          borderRadius: {
            'card': '14px',
          },
          boxShadow: {
            'card': 'rgba(0,0,0,0.03) 0 0 0 1px, rgba(0,0,0,0.04) 0 2px 6px, rgba(0,0,0,0.06) 0 4px 8px',
          },
          maxWidth: {
            'content': '1280px',
          },

  <style>
    /* ========== PAPER TEXTURE ========== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      opacity: 0.8;
    }

    /* ========== SCROLLBAR ========== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ddd1c0; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #b8a898; }

    /* ========== LINE CLAMP ========== */
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    /* ========== TOAST ========== */
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .toast-in { animation: slideUp 0.3s ease; }

    /* ========== STAGGERED CARD REVEAL ========== */
    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card-reveal {
      animation: cardReveal 0.5s ease both;
    }

    /* ========== HERO FLOAT ========== */
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .hero-float {
      animation: gentleFloat 5s ease-in-out infinite;
    }

    /* ========== STAR RATING ========== */
    .star { color: #e8a860; }
    .star-empty { color: #eee7db; }

    /* ========== TAG ========== */
    .tag-amber { background: #fdf0e0; color: #b8782a; }
    .tag-stone { background: #f8f4ed; color: #4a3f35; }

    /* ========== TAB UNDERLINE ========== */
    .tab-active { color: #3d3226; background: #f8f4ed; }

    /* ========== BRAND GRADIENT ========== */
    .brand-title {
      background: linear-gradient(135deg, #e8a860 0%, #d4913e 60%, #b8782a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ========== HERO GLOW ========== */
    .hero-glow {
      background: radial-gradient(ellipse, rgba(232,168,96,0.2) 0%, transparent 70%);
    }

    /* ========== DISTINCTIVE CARD STYLE ========== */
    .note-card {
      position: relative;
      background: #fffdf9;
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 4px 18px 18px 18px;
      transition: transform 0.2s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .note-card::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px;
      width: 40px; height: 3px;
      background: linear-gradient(90deg, #e8a860, transparent);
      border-radius: 0 0 3px 0;
      transition: width 0.3s ease;
    }
    .note-card:hover {
      transform: translateY(-2px);
      border-color: rgba(232,168,96,0.2);
      box-shadow: 0 8px 32px rgba(61,50,38,0.06), 0 1px 0 rgba(0,0,0,0.04);
    }
    .note-card:hover::before {
      width: 60px;
    }

    /* ========== SECTION DIVIDER ========== */
    .section-divider {
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, #e8a860, #d4913e);
      border-radius: 2px;
    }

    /* ========== INPUT FOCUS GLOW ========== */
    .input-glow:focus {
      box-shadow: 0 0 0 3px rgba(232,168,96,0.12), 0 1px 2px rgba(0,0,0,0.04);
    }

    /* ========== CUSTOM CURSOR ========== */
    body {
      cursor: default;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* Chinese text optimization */
    :lang(zh),
    [lang="zh-CN"],
    .font-noto {
      font-kerning: normal;
      font-feature-settings: "kern" 1;
      text-size-adjust: 100%;
    }
    a, button, select, .note-card, [role="button"] {
      cursor: url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='12' cy='12' r='8' stroke='%23e8a860' stroke-width='1.5'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23e8a860'/%3E%3C/svg%3E") 12 12, pointer;
    }
    input, textarea {
      cursor: url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M4 4h16v16H4z' stroke='%23e8a860' stroke-width='1.5'/%3E%3C/svg%3E") 12 12, text;
    }

    /* ========== STICKER TAG ========== */
    .sticker-tag {
      display: inline-block;
      padding: 3px 10px;
      font-size: 0.75rem;
      font-weight: 500;
      border-radius: 3px 10px 3px 10px;
      background: #fef8f0;
      color: #b8782a;
      border: 1px solid rgba(232,168,96,0.2);
      transform: rotate(-0.5deg);
      transition: transform 0.2s ease;
      letter-spacing: 0.02em;
    }
    .sticker-tag:hover {
      transform: rotate(0deg) scale(1.05);
    }

    /* ========== PULSE DOT (for live indicators) ========== */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .pulse-dot {
      animation: pulse 2s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-warm-50 text-warm-800 font-noto antialiased">

  <!-- ==================== TOP NAVIGATION ==================== -->

        <span class="text-sm text-warm-400 font-kuai tracking-wide group-hover:text-warm-500 transition-colors">碎片知识，一口一个</span>

      <!-- Desktop Nav Actions -->
      <div class="hidden sm:flex items-center gap-3">

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>

    <!-- Mobile Menu Dropdown -->
    <div id="mobile-menu" class="sm:hidden hidden bg-white border-b border-warm-200 px-4 py-3 space-y-1">
      <button id="btn-categories-mobile" class="w-full text-left px-4 py-3 text-sm font-medium text-warm-600 hover:bg-warm-100 rounded-lg flex items-center gap-2 font-noto">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
        </svg>
        分类管理
      </button>
      <button id="btn-settings-mobile" class="w-full text-left px-4 py-3 text-sm font-medium text-warm-600 hover:bg-warm-100 rounded-lg flex items-center gap-2 font-noto">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="max-w-content mx-auto px-4 sm:px-8 py-4 sm:py-8">

    <!-- ===== HERO TITLE ===== -->
    <section class="mb-10 sm:mb-14 mt-12 sm:mt-24 relative">
      <!-- Atmosphere: layered glows -->
      <div class="absolute -top-20 left-1/4 w-96 h-96 hero-glow pointer-events-none opacity-60"></div>
      <div class="absolute -top-10 right-1/4 w-64 h-64 bg-honey-100/20 rounded-full blur-3xl pointer-events-none"></div>

      <div class="relative max-w-2xl mx-auto">
        <!-- Decorative tiny label above title -->
        <p class="text-xs font-fredoka font-medium text-honey-400 tracking-[0.2em] uppercase mb-6 sm:mb-8 text-center">
          · knowledge curator ·
        </p>

        <h1 class="font-caveat text-5xl sm:text-7xl lg:text-8xl font-semibold tracking-normal leading-none hero-float text-center" style="word-spacing: 0.1em;">
          <span class="text-warm-800">Wise</span><span class="brand-title">Snack</span>
        </h1>

        <!-- Tagline offset right for asymmetry -->
        <p class="mt-4 sm:mt-6 text-base sm:text-lg text-warm-400 font-noto tracking-wider text-center sm:text-right sm:-mr-4" style="letter-spacing: 0.08em; font-style: italic;">
          bite-sized wisdom, always fresh
        </p>
      </div>
    </section>

    <!-- Decorative divider -->
    <div class="flex justify-center mb-8 sm:mb-10">
      <div class="section-divider"></div>

    <!-- ===== INPUT SECTION ===== -->
    <section class="bg-white border border-warm-200 rounded-xl sm:rounded-2xl p-4 sm:p-6 mb-4 sm:mb-8">
      <!-- Input Tabs -->
      <div class="flex gap-2 mb-5">

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
          </svg>
          粘贴链接
        </button>
      </div>

      <!-- Link Input Panel -->
      <div id="panel-link" class="input-panel">
        <div class="flex flex-col sm:flex-row gap-3">
          <div class="flex-1 relative">
            <textarea id="input-link" rows="3" placeholder="粘贴短视频链接或小红书图文笔记链接，支持多行同时粘贴…" class="w-full px-4 py-3 text-sm font-noto text-warm-800 bg-warm-100 border border-warm-200 rounded-xl resize-none outline-none focus:border-honey-400 focus:ring-2 focus:ring-honey-100 transition-all placeholder:text-warm-400"></textarea>

              </svg>
            </button>
          </div>
          <button id="btn-submit" class="sm:flex-shrink-0 px-6 py-3 bg-honey-400 hover:bg-honey-500 active:bg-honey-500 text-white text-sm font-medium rounded-xl transition-colors flex items-center justify-center gap-2">

        <div class="relative">
          <div class="flex items-center gap-2.5 mb-3">

          <span class="text-sm font-noto font-medium text-warm-400 ml-1">篇</span>
        </div>
      </div>

      <!-- Average Quality -->
      <div class="relative overflow-hidden bg-white border border-warm-200/70 rounded-2xl p-4 sm:p-5 hover:border-honey-200 hover:shadow-sm transition-all duration-300 group">
        <div class="absolute -right-4 -bottom-4 w-16 h-16 bg-honey-50/80 rounded-full group-hover:scale-125 transition-transform duration-500"></div>
        <div class="relative">
          <div class="flex items-center gap-2.5 mb-3">
            <span class="w-9 h-9 bg-honey-100/60 rounded-xl flex items-center justify-center">
              <svg class="w-4 h-4 text-honey-400 star" fill="currentColor" stroke="none" viewBox="0 0 24 24">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
              </svg>
            </span>
            <span class="text-xs font-fredoka font-semibold text-warm-500 tracking-wider uppercase">平均质量</span>
          </div>
          <span id="stat-avg-quality" class="text-3xl sm:text-4xl font-fredoka font-bold text-warm-800 tracking-tight">-</span>
          <span class="text-sm font-noto font-medium text-warm-400 ml-1">星</span>
        </div>
      </div>
    </section>

    <!-- ===== FILTER BAR ===== -->
    <section class="bg-white/70 backdrop-blur-sm border border-warm-200/60 rounded-2xl p-3 sm:p-4 mb-4 sm:mb-6">
      <div class="flex flex-wrap items-center gap-2 sm:gap-3">
        <!-- Search -->
        <div class="flex-1 min-w-[200px] relative">
          <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-warm-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input id="search-input" type="text" placeholder="搜索笔记…" class="w-full pl-10 pr-4 py-2.5 text-sm font-noto bg-warm-100/80 border border-warm-200 rounded-xl outline-none focus:border-honey-400 focus:ring-2 focus:ring-honey-100/50 focus:bg-white transition-all placeholder:text-warm-400">
        </div>
        <!-- Search Scope -->
        <select id="search-scope" class="px-3.5 py-2.5 text-sm font-noto bg-warm-100/80 border border-warm-200 rounded-xl text-warm-600 outline-none focus:border-honey-400 focus:ring-2 focus:ring-honey-100/50 transition-all cursor-pointer hover:bg-warm-200/50">
          <option value="all">搜索全文</option>
          <option value="title">仅搜索标题</option>
        </select>
        <!-- Tag Filter -->
        <select id="filter-tag" class="px-3.5 py-2.5 text-sm font-noto bg-warm-100/80 border border-warm-200 rounded-xl text-warm-600 outline-none focus:border-honey-400 focus:ring-2 focus:ring-honey-100/50 transition-all cursor-pointer hover:bg-warm-200/50">
          <option value="all">全部标签</option>
        </select>
        <!-- Sort -->
        <select id="sort-by" class="px-3.5 py-2.5 text-sm font-noto bg-warm-100/80 border border-warm-200 rounded-xl text-warm-600 outline-none focus:border-honey-400 focus:ring-2 focus:ring-honey-100/50 transition-all cursor-pointer hover:bg-warm-200/50">
          <option value="newest">最新</option>
          <option value="oldest">最早</option>
          <option value="quality">质量最高</option>
          <option value="views">浏览最多</option>
        </select>
        <!-- View toggle: low-quality hidden -->
        <button id="btn-toggle-low-quality" class="flex-shrink-0 px-3 py-2.5 text-sm font-fredoka text-warm-500 hover:text-honey-500 hover:bg-honey-50/50 bg-warm-100/80 border border-warm-200 rounded-xl transition-all cursor-pointer" title="显示/隐藏低质内容">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
          </svg>
        </button>
        <!-- Batch management -->
        <button id="btn-batch-mode" class="flex-shrink-0 px-3 py-2.5 text-sm font-fredoka text-warm-500 hover:text-honey-500 hover:bg-honey-50/50 bg-warm-100/80 border border-warm-200 rounded-xl transition-all cursor-pointer" title="批量管理">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- Active Filters Display -->
    <div id="active-filters" class="flex items-center gap-2 mb-4 hidden">
      <span class="text-xs font-noto text-warm-400">当前筛选：</span>
      <div id="active-filter-tags" class="flex items-center gap-1.5"></div>
      <button id="btn-clear-filters" class="text-xs font-fredoka text-honey-500 hover:text-honey-600 font-medium">清除全部</button>
    </div>

    <!-- ===== CARD GRID ===== -->
    <section id="card-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4 mb-4 sm:mb-8">
      <!-- Cards rendered by JS -->
    </section>

    <!-- Empty State -->
    <div id="empty-state" class="text-center py-20">
      <svg class="w-16 h-16 text-warm-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
      </svg>
      <p class="text-warm-400 text-sm font-noto mb-2">还没有干货笔记</p>
      <p class="text-warm-300 text-sm font-noto">粘贴文本内容，开始你的第一条知识整理吧</p>
    </div>

    <!-- Load More -->
    <div id="load-more-container" class="text-center hidden">
      <button id="btn-load-more" class="px-8 py-3 text-sm font-fredoka font-medium text-warm-600 bg-warm-200 hover:bg-warm-300 rounded-xl transition-colors">
        加载更多
      </button>
    </div>

  </main>

  <!-- ==================== NOTE DETAIL MODAL ==================== -->
  <div id="modal-detail" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center sm:p-4 md:p-8">
    <div class="absolute inset-0 bg-black/50" onclick="closeModal('modal-detail')"></div>
    <div class="relative bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg md:max-w-2xl lg:max-w-3xl max-h-[90vh] sm:max-h-[85vh] overflow-hidden shadow-xl flex flex-col">
      <!-- Modal Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-warm-100 flex-shrink-0">
        <div class="flex items-center gap-3">
          <span id="modal-source-icon" class="w-8 h-8 bg-warm-200 rounded-lg flex items-center justify-center">
            <svg class="w-4 h-4 text-warm-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101"/>
            </svg>
          </span>
          <div>
            <h2 id="modal-title" class="text-xl font-fredoka font-semibold text-warm-800"></h2>
            <span id="modal-date" class="text-sm text-warm-400 font-noto"></span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="editNote()" class="px-3 py-1.5 text-sm font-noto text-warm-600 hover:bg-warm-200 rounded-lg transition-colors">编辑</button>
          <button id="modal-btn-export" class="px-3 py-1.5 text-sm font-noto text-warm-600 hover:bg-warm-200 rounded-lg transition-colors">导出</button>
          <button onclick="closeModal('modal-detail')" class="w-8 h-8 flex items-center justify-center text-warm-400 hover:text-warm-600 hover:bg-warm-200 rounded-full transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>
      <!-- Modal Body -->
      <div class="flex-1 overflow-y-auto px-6 py-5 space-y-5">
        <div>
          <h3 class="text-base font-fredoka font-semibold text-honey-500 mb-2 flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
            </svg>
            核心观点
          </h3>
          <p id="modal-core-points" class="text-sm sm:text-base text-warm-700 leading-relaxed bg-honey-50/50 rounded-xl p-4 font-noto"></p>
        </div>
        <div>
          <h3 class="text-base font-fredoka font-semibold text-honey-500 mb-2 flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
            </svg>
            干货知识点
          </h3>
          <p id="modal-knowledge" class="text-sm sm:text-base text-warm-700 leading-relaxed bg-green-50/50 rounded-xl p-4 font-noto"></p>
        </div>
        <div>
          <h3 class="text-base font-fredoka font-semibold text-honey-500 mb-2 flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
            </svg>
            个人感悟区
          </h3>
          <p id="modal-reflection" class="text-sm sm:text-base text-warm-700 leading-relaxed bg-blue-50/50 rounded-xl p-4 font-noto"></p>
        </div>
        <!-- Quality & Tags -->
        <div class="flex flex-wrap items-center gap-4 pt-2 border-t border-warm-100">
          <div class="flex items-center gap-1.5">
            <span class="text-sm text-warm-500 font-noto">质量评分：</span>
            <span id="modal-stars" class="flex gap-0.5"></span>
            <span id="modal-quality-reason" class="text-sm font-noto text-warm-400 ml-1"></span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="text-sm text-warm-500 font-noto">标签：</span>
            <span id="modal-tags" class="flex gap-1.5"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== CATEGORY MANAGER MODAL ==================== -->
  <div id="modal-categories" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center sm:p-4 md:p-8">
    <div class="absolute inset-0 bg-black/50" onclick="closeModal('modal-categories')"></div>
    <div class="relative bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg shadow-xl">
      <div class="flex items-center justify-between px-6 py-4 border-b border-warm-100">
        <h2 class="text-lg font-fredoka font-semibold text-warm-800">分类管理</h2>
        <button onclick="closeModal('modal-categories')" class="w-8 h-8 flex items-center justify-center text-warm-400 hover:text-warm-600 hover:bg-warm-200 rounded-full transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="p-6 space-y-3">
        <div id="category-list" class="space-y-2 max-h-64 overflow-y-auto"></div>
        <div class="flex gap-2 pt-2">
          <input id="new-category-name" type="text" placeholder="新建分类名称…" class="flex-1 px-3 py-2 text-sm font-noto border border-warm-200 rounded-lg outline-none focus:border-honey-400 transition-colors">
          <input id="new-category-color" type="color" value="#e8a860" class="w-10 h-10 rounded-lg border border-warm-200 cursor-pointer p-0.5">
          <button id="btn-add-category" class="px-4 py-2 bg-honey-400 hover:bg-honey-500 text-white text-sm font-noto font-medium rounded-lg transition-colors">添加</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== SETTINGS MODAL ==================== -->
  <div id="modal-settings" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center sm:p-4 md:p-8">
    <div class="absolute inset-0 bg-black/50" onclick="closeModal('modal-settings')"></div>
    <div class="relative bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg shadow-xl">
      <div class="flex items-center justify-between px-6 py-4 border-b border-warm-100">
        <h2 class="text-lg font-fredoka font-semibold text-warm-800">设置</h2>
        <button onclick="closeModal('modal-settings')" class="w-8 h-8 flex items-center justify-center text-warm-400 hover:text-warm-600 hover:bg-warm-200 rounded-full transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="p-6 space-y-5">
        <!-- Auto hide low quality -->
        <div class="flex items-center justify-between">
          <div>
            <span class="text-sm font-fredoka font-medium text-warm-800">自动隐藏低质内容</span>
            <p class="text-xs text-warm-400 mt-0.5 font-noto">评分低于阈值的内容将不在主列表中显示</p>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="setting-auto-hide" class="sr-only peer">
            <div class="w-9 h-5 bg-warm-300 peer-focus:ring-2 peer-focus:ring-honey-100 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-honey-400"></div>
          </label>
        </div>
        <!-- Low quality threshold -->
        <div>
          <label class="text-sm font-fredoka font-medium text-warm-800 block mb-2">低质内容阈值：<span id="threshold-value" class="text-honey-500">3</span> <span class="font-noto">星以下</span></label>
          <input type="range" id="setting-threshold" min="1" max="5" value="3" class="w-full h-2 bg-warm-300 rounded-lg appearance-none cursor-pointer accent-honey-400">
          <div class="flex justify-between text-xs text-warm-400 mt-1">
            <span>1 星</span><span>2 星</span><span>3 星</span><span>4 星</span><span>5 星</span>
          </div>
        </div>
        <!-- Review interval -->
        <div>
          <label class="text-sm font-fredoka font-medium text-warm-800 block mb-2">复习间隔：<span id="review-interval-value" class="text-honey-500">3</span> <span class="font-noto">天</span></label>
          <input type="range" id="setting-review-interval" min="1" max="14" value="3" class="w-full h-2 bg-warm-300 rounded-lg appearance-none cursor-pointer accent-honey-400">
          <div class="flex justify-between text-xs text-warm-400 mt-1">
            <span>1 天</span><span>7 天</span><span>14 天</span>
          </div>
        </div>
        <!-- Export all -->
        <div class="pt-2 border-t border-warm-100">
          <span class="text-sm font-fredoka font-medium text-warm-800 block mb-3">数据管理</span>
          <div class="flex gap-2">
            <button id="btn-export-all-json" class="flex-1 px-4 py-2 text-sm font-noto text-warm-600 bg-warm-200 hover:bg-warm-300 rounded-lg transition-colors">导出全部 JSON</button>
            <button id="btn-import-json" class="flex-1 px-4 py-2 text-sm font-noto text-warm-600 bg-warm-200 hover:bg-warm-300 rounded-lg transition-colors">导入 JSON 备份</button>
            <input type="file" id="import-json-input" accept=".json" class="hidden">
          </div>
        </div>
        <!-- Danger zone -->
        <div class="pt-2 border-t border-red-100">
          <button id="btn-clear-all" class="px-4 py-2 text-sm font-noto text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors">
            清除全部数据
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== BATCH ACTION BAR ==================== -->
  <div id="batch-bar" class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-warm-200 shadow-lg transform translate-y-full transition-transform">
    <div class="max-w-content mx-auto px-4 sm:px-8 py-3 flex flex-col sm:flex-row items-start sm:items-center gap-2 sm:gap-0 sm:justify-between">
      <div class="flex items-center gap-3">
        <button id="btn-select-all" class="text-sm font-noto text-warm-600 hover:text-warm-800 font-medium">全选</button>
        <span id="batch-count" class="text-xs sm:text-sm text-warm-400 font-noto">已选 0 条</span>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <select id="batch-move-category" class="px-2 sm:px-3 py-2 text-xs sm:text-sm bg-warm-100 border border-warm-200 rounded-lg text-warm-600 outline-none">
          <option value="">移动到分类…</option>
        </select>
        <button id="btn-batch-delete" class="px-3 sm:px-4 py-2 text-xs sm:text-sm font-noto text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors">批量删除</button>
        <button id="btn-cancel-batch" class="px-3 sm:px-4 py-2 text-xs sm:text-sm font-noto text-warm-600 bg-warm-200 hover:bg-warm-300 rounded-lg transition-colors">取消</button>
      </div>
    </div>
  </div>

  <!-- ==================== TOAST CONTAINER ==================== -->
  <div id="toast-container" class="fixed bottom-4 sm:bottom-6 left-4 sm:left-auto right-4 sm:right-6 z-50 flex flex-col items-center sm:items-end gap-2"></div>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="js/store.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/import.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
